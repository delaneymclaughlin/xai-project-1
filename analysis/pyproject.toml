[project]
name = "xai-feed-sim"
version = "0.1.0"
description = "Seeded synthetic feed simulation: XGBoost ranker on X-weighted engagement, audited with SHAP, LIME and counterfactuals."
requires-python = ">=3.12"
dependencies = [
    "lime>=0.2.0.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false
